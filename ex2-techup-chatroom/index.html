<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>

    <header class="chat-header">
        <h1>Techup Chatroom</h1>
    </header>

    <main class="chat-container">
        
        <div class="message-wrapper right">
            <div class="message-box green-box tail">
                สวัสดีจ้า
            </div>
        </div>

        <div class="message-wrapper right">
            <div class="message-box light-gray-box">
                Coding สนุกจังเลย
                <button class="delete-btn">x</button>
            </div>
        </div>

        <div class="message-wrapper right">
            <div class="message-box green-box">
                🧑‍💻 😍
            </div>
        </div>

        <div class="message-wrapper left">
            <div class="message-box dark-gray-box">
                😍
            </div>
        </div>

        <div class="message-wrapper left">
            <div class="message-box dark-gray-box">
                🥳
            </div>
        </div>

    </main>

</body>

</html>
